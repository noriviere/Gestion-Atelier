<div class="champ{% if champ.errors %} en-erreur{% endif %}{% if classe %} {{ classe }}{% endif %}">
  {% if champ.field.widget.input_type == "radio" %}<span class="libelle-champ">{{ champ.label }}</span>{{ champ }}{% else %}{{ champ.label_tag }}{{ champ }}{% endif %}
  {% if champ.help_text %}<span class="aide">{{ champ.help_text }}</span>{% endif %}
  {% for erreur in champ.errors %}<span class="erreur">{{ erreur }}</span>{% endfor %}
</div>
