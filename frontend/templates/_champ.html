<div class="champ{% if champ.errors %} en-erreur{% endif %}">
  <label for="{{ champ.id_for_label }}">{{ champ.label }}{% if champ.field.required %} *{% endif %}</label>
  {{ champ }}
  {% if champ.help_text %}<div class="discret">{{ champ.help_text }}</div>{% endif %}
  {% for erreur in champ.errors %}<div class="erreur-champ">{{ erreur }}</div>{% endfor %}
</div>
