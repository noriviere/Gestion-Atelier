# Lancement sur la machine virtuelle Linux : docker compose up -d
# Avant le premier lancement, créer à côté de ce fichier un fichier .env (jamais versionné) avec :
#   DJANGO_SECRET_KEY=<longue chaîne aléatoire, ex. python -c "import secrets; print(secrets.token_urlsafe(50))">
#   DJANGO_ALLOWED_HOSTS=<nom ou adresse IP de la VM, séparés par des virgules>
#   POSTGRES_PASSWORD=<mot de passe de la base>
# Pour une démo sur la VM (efface tout) : docker compose exec web python manage.py charger_demo --effacer-tout
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: atelier
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
    volumes:
      - donnees:/var/lib/postgresql/data
    restart: unless-stopped
  web:
    build: .
    environment:
      POSTGRES_DB: atelier
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?à définir dans .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?à définir dans .env}
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      - documents:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
volumes:
  donnees:
  documents:
