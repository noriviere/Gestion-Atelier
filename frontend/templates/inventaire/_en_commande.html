{% for ligne in article.lignes_en_cours %}<a class="etiquette {% if ligne.commande.en_retard %}alerte{% else %}prefere{% endif %}" href="{{ ligne.commande.get_absolute_url }}" title="{{ ligne.commande.get_etat_display }}{% if ligne.commande.date_prevue %}, livraison prévue le {{ ligne.commande.date_prevue|date:'d/m/Y' }}{% endif %}">{{ ligne.quantite|floatformat:"-2" }} en commande{% if ligne.commande.en_retard %} · en retard{% elif ligne.commande.etat == "recue" %} · reçue{% elif ligne.commande.date_prevue %} · {{ ligne.commande.date_prevue|date:"d/m" }}{% endif %}</a> {% endfor %}
